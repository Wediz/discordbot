<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/g.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
// ?v=1 → vertical 1080×1920 (TikTok), otherwise 1920×1080 (YouTube)
const V = new URLSearchParams(location.search).get('v')==='1';
const W = V?1080:1920, H = V?1920:1080, FPS=30, DUR=10.5;
const TOP = V?0:118, CH = H-2*TOP, BOT = TOP+CH;
const U = V?1:1;                                   // type scale
const C={ text:'#ECE8E0', dim:'rgba(236,232,224,.6)', red:'#FF2B2B' };
const cv=document.getElementById('c'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{ const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
const eo=t=>1-Math.pow(1-clamp(t),3);
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
const hash=n=>{ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };
function vnoise(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return lerp(hash(i),hash(i+1),u); }
const mk=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };

const GRAIN=[]; { const r=rng(7); for(let k=0;k<8;k++){ const g=mk(480,480), gc=g.getContext('2d'), im=gc.createImageData(480,480);
  for(let i=0;i<im.data.length;i+=4){ const v=r()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } gc.putImageData(im,0,0); GRAIN.push(g);} }
const DUST=(()=>{ const r=rng(11),a=[]; for(let i=0;i<240;i++) a.push({x:r(),y:r(),z:.4+r()*1.4,s:r()*6.28,v:.2+r()*.8}); return a; })();

const IMG={}; for(let i=1;i<=14;i++){ const k=String(i).padStart(2,'0'); IMG[k]=new Image(); IMG[k].src=`img/${k}.png`; }
for(const k of ['h_chateau','h_course','h_franchir','h_grimpe','h_saut','h_hall','h_marche']){ IMG[k]=new Image(); IMG[k].src=`img/${k}.png`; }
IMG.f1=new Image(); IMG.f1.src='face1.png'; IMG.f2=new Image(); IMG.f2.src='face2.png';
const TILE=k=>/^\d+$/.test(k);

// shots: camera from→to (normalised centre, zoom, rotation); blur = speed zoom-blur strength
const BEAT=[2.3,2.85,3.4,3.95,4.5,5.05,5.6];
const SHOTS=[
 {k:'h_chateau',t0:.7, t1:2.3, a:{x:.46,y:.5,z:1.0}, b:{x:.47,y:.46,z:1.12}, rays:{x:.88,y:.36,ang:Math.PI*.97,spread:.9,s:.45}},
 {k:'h_course', t0:2.3,t1:2.85,a:{x:.43,y:.42,z:1.0},b:{x:.45,y:.42,z:1.22}, blur:.9, word:'COURIR.'},
 {k:'h_franchir',t0:2.85,t1:3.4,a:{x:.42,y:.45,z:1.25},b:{x:.46,y:.42,z:1.05}, blur:.7, word:'FRANCHIR.'},
 {k:'h_grimpe', t0:3.4,t1:3.95,a:{x:.55,y:.5,z:1.02},b:{x:.54,y:.34,z:1.14}, blur:.5, word:'GRIMPER.'},
 {k:'h_saut',   t0:3.95,t1:4.5,a:{x:.44,y:.38,z:1.3,r:-.03},b:{x:.5,y:.36,z:1.08,r:.03}, blur:.7, word:'SAUTER.'},
 {k:'h_hall',   t0:4.5,t1:5.05,a:{x:.5,y:.55,z:1.05},b:{x:.54,y:.55,z:1.35}, blur:.6, word:'S\u2019INFILTRER.'},
 {k:'h_marche', t0:5.05,t1:5.6,a:{x:.58,y:.5,z:1.0},b:{x:.58,y:.46,z:1.3}, blur:.5, word:'DISPARA\u00CETRE.'},
 {k:'f1',t0:5.6,t1:7.3,a:{x:.52,y:.43,z:V?1.05:1.0},b:{x:.52,y:.42,z:V?1.28:1.35}},
];
function camAt(s,t){ const p=clamp((t-s.t0)/(s.t1-s.t0)), e=s.blur? p : lerp(p,eo(p),.3);
  return {x:lerp(s.a.x,s.b.x,e), y:lerp(s.a.y,s.b.y,e), z:lerp(s.a.z,s.b.z,e), r:lerp(s.a.r||0,s.b.r||0,e)}; }
function place(s,t){
  const img=IMG[s.k], iw=img.width, ih=img.height, c=camAt(s,t);
  const base=Math.max(W/iw, CH/ih), S=base*c.z, vw=W/S, vh=CH/S;
  let cx=c.x*iw, cy=c.y*ih;
  cx=clamp(cx,vw/2,iw-vw/2); cy=clamp(cy, Math.max(vh/2, (TILE(s.k)?.15*ih:0)+vh/2), ih-vh/2);   // hide tile numbers
  return {img,iw,ih,cx,cy,S,r:c.r};
}
function drawShot(s,t,mul=1){
  const P=place(s,t);
  const jx=(vnoise(t*9)-.5)*(s.blur?22:6), jy=(vnoise(t*9+4)-.5)*(s.blur?22:6);
  ctx.save(); ctx.beginPath(); ctx.rect(0,TOP,W,CH); ctx.clip();
  const n = s.blur ? 6 : 1;
  for(let i=n-1;i>=0;i--){                       // zoom blur: stacked, slightly larger copies
    ctx.save(); ctx.globalAlpha = (i===0 ? 1 : .16)*mul; ctx.translate(W/2+jx,TOP+CH/2+jy); ctx.rotate(P.r); ctx.scale(P.S*(1+i*.018*(s.blur||0)),P.S*(1+i*.018*(s.blur||0)));
    ctx.imageSmoothingQuality='high'; ctx.drawImage(P.img,-P.cx,-P.cy); ctx.restore(); }
  ctx.restore();
  if(s.rays){ const rx=W/2+(s.rays.x*P.iw-P.cx)*P.S, ry=TOP+CH/2+(s.rays.y*P.ih-P.cy)*P.S; rays(rx,ry,t,s.rays.ang,s.rays.spread,s.rays.s); }
}
function rays(x,y,t,ang,spread,str){
  ctx.save(); ctx.beginPath(); ctx.rect(0,TOP,W,CH); ctx.clip(); ctx.globalCompositeOperation='screen';
  for(let i=0;i<9;i++){ const a=ang+(i/8-.5)*spread+Math.sin(t*.4+i)*.02, w=.02+.03*hash(i*3.3), k=(.35+.65*vnoise(t*.8+i*7.1))*str, Lr=2400;
    const g=ctx.createLinearGradient(x,y,x+Math.cos(a)*Lr,y+Math.sin(a)*Lr); g.addColorStop(0,`rgba(255,236,200,${.35*k})`); g.addColorStop(1,'rgba(255,230,190,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a-w)*Lr,y+Math.sin(a-w)*Lr); ctx.lineTo(x+Math.cos(a+w)*Lr,y+Math.sin(a+w)*Lr); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function dust(t,lx,ly,rad,alpha){ ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const d of DUST){ const x=((d.x*W+t*14*d.v+Math.sin(t*.5+d.s)*20)%W+W)%W, y=((d.y*H+t*9*d.v+Math.cos(t*.4+d.s)*14)%H+H)%H;
    const k=clamp(1-Math.hypot(x-lx,y-ly)/rad); if(k<=0) continue; ctx.fillStyle=`rgba(255,244,222,${.55*k*alpha})`; ctx.beginPath(); ctx.arc(x,y,d.z*1.4,0,6.283); ctx.fill(); }
  ctx.restore(); }

function txt(s,x,y,font,color,align='center',alpha=1,spacing=0){ if(alpha<=0) return;
  ctx.save(); ctx.font=font; ctx.fillStyle=color; ctx.globalAlpha=alpha; ctx.textAlign=align; ctx.textBaseline='middle'; if(spacing) ctx.letterSpacing=spacing+'px';
  ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=18; ctx.fillText(s,x,y); ctx.restore(); }
const typed=(s,t,t0,t1)=>s.slice(0,Math.floor(s.length*clamp((t-t0)/(t1-t0))));
function brackets(m,len,col,alpha){ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.lineWidth=4; const x0=m,y0=TOP+m,x1=W-m,y1=BOT-m; ctx.beginPath();
  for(const [x,y,dx,dy] of [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]){ ctx.moveTo(x,y+dy*len); ctx.lineTo(x,y); ctx.lineTo(x+dx*len,y); } ctx.stroke(); ctx.restore(); }
function notrace(cx,cy,size,slashP,alpha=1){
  ctx.save(); ctx.globalAlpha=alpha; ctx.font=`${size}px Anton`; ctx.letterSpacing=(size*.06)+'px'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const full=ctx.measureText('NOTRACE').width, wN=ctx.measureText('N').width, wO=ctx.measureText('O').width-size*.06, x0=cx-full/2+size*.03;
  ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=30; ctx.fillStyle=C.text; ctx.fillText('NOTRACE',x0,cy); const ox=x0+wN+wO/2;
  if(slashP>0){ ctx.shadowColor='rgba(255,43,43,.8)'; ctx.shadowBlur=24; ctx.strokeStyle=C.red; ctx.lineWidth=size*.064; ctx.lineCap='square';
    const x1=ox-wO*.55,y1=cy+size*.33,x2=ox+wO*.55,y2=cy-size*.55; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,slashP),lerp(y1,y2,slashP)); ctx.stroke(); }
  ctx.restore(); }

function render(t){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  let flash=0, shake=0;

  for(const s of SHOTS) if(t>=s.t0 && t<s.t1) drawShot(s,t);
  if(t>=.7 && t<2.3) ctx.fillStyle=`rgba(0,0,0,${1-ss(.7,1.2,t)})`, ctx.fillRect(0,0,W,H);
  // red rim + darkness on the face shot
  if(t>=5.6 && t<7.3){ ctx.save(); ctx.globalCompositeOperation='screen'; const rg=ctx.createRadialGradient(W+100,H*.5,0,W+100,H*.5,W*.75); rg.addColorStop(0,'rgba(255,40,40,.3)'); rg.addColorStop(1,'rgba(255,0,0,0)'); ctx.fillStyle=rg; ctx.fillRect(0,0,W,H); ctx.restore(); }
  // action words
  const s=SHOTS.find(q=>q.word && t>=q.t0 && t<q.t1);
  if(s){ const lt=t-s.t0, sc=lerp(1.3,1,eo(lt/.14));
    ctx.save(); ctx.translate(W/2,TOP+CH*(V?.62:.55)); ctx.scale(sc,sc);
    ctx.font=`${V?(s.word.length>10?120:150):(s.word.length>10?170:200)}px Anton`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.letterSpacing='4px';
    ctx.lineJoin='round'; ctx.lineWidth=14; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(s.word,0,0); ctx.fillStyle= s.word.startsWith('DISP')?C.red:C.text; ctx.fillText(s.word,0,0);
    ctx.restore(); }
  for(const b of BEAT){ flash=Math.max(flash,(1-ss(b,b+.08,t))*ss(b-.01,b,t)*.55); shake=Math.max(shake,(1-ss(b,b+.2,t))*ss(b-.01,b,t)*16); }

  // title card
  if(t>=7.3){ const lt=t-7.3;
    ctx.fillStyle='#050506'; ctx.fillRect(0,0,W,H);
    // château ghost + flashlight sweep
    const s8={k:'h_chateau',t0:7.3,t1:10.5,a:{x:.46,y:.5,z:1.1},b:{x:.46,y:.5,z:1.18}}; drawShot(s8,t,.24);
    const lx=lerp(-W*.2,W*1.2,ss(0,2.4,lt)), ly=H*.5;
    ctx.save(); ctx.globalCompositeOperation='screen'; const g=ctx.createRadialGradient(lx,ly,0,lx,ly,W*.45); g.addColorStop(0,'rgba(255,240,215,.22)'); g.addColorStop(1,'rgba(255,240,215,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
    dust(t,lx,ly,W*.5,1);
    const ty=H*(V?.46:.47), sz=V?210:230;
    notrace(W/2,ty,sz,eo(ss(.35,.6,lt)),ss(.02,.12,lt));
    txt('URBEX  ·  SPORT  ·  INFILTRATION',W/2,ty+sz*.78,`700 ${V?34:38}px 'JetBrains Mono'`,C.red,'center',ss(.6,.9,lt),V?8:12);
    txt('URBEX FRANCE',W/2,ty+sz*.78+(V?70:66),`400 ${V?28:28}px 'JetBrains Mono'`,C.dim,'center',ss(.9,1.2,lt),14);
    flash=Math.max(flash,(1-ss(0,.15,lt))*.6); shake=Math.max(shake,(1-ss(0,.3,lt))*14);
    ctx.fillStyle=`rgba(0,0,0,${ss(2.85,3.05,lt)})`; ctx.fillRect(0,0,W,H);   // lights out
  }

  // ── HUD (everything before the lights go out) ──
  if(t<7.3){
    const ha=ss(.15,.5,t), m=V?70:60;
    brackets(m, V?80:70, t>=5.6&&t<7.3?C.red:C.text, ha*.8);
    const hy=TOP+m+(V?150:40);
    txt('● REC', m+30, hy, `700 ${V?30:26}px 'JetBrains Mono'`, C.red,'left', ha*(Math.floor(t*2.5)%2?1:.3));
    txt('NØTRACE', W-m-30, hy, `400 ${V?26:24}px 'JetBrains Mono'`, C.dim,'right', ha, 6);
    // status line: types in, then locks red on the face
    const st='STATUT : INDÉTECTABLE';
    const sy = V ? TOP+m+230 : BOT-m-40;
    const lock = t>=5.6;
    txt(typed(st,t,.2,1.0), V?W/2:m+30, sy, `700 ${V?36:30}px 'JetBrains Mono'`, lock?C.red:C.text, V?'center':'left', ha, 3);
    if(t>=5.75 && t<7.3) txt(typed('SIGNATURE THERMIQUE : AUCUNE',t,5.75,6.4), V?W/2:m+30, sy+(V?56:-44), `400 ${V?30:26}px 'JetBrains Mono'`, C.dim, V?'center':'left', 1, 2);
    // sport telemetry (illustrative)
    const act=ss(2.2,2.5,t)*(1-ss(5.5,5.7,t));
    const bpm=Math.round(lerp(88,168,ss(1.5,5.4,t))+ (vnoise(t*6)-.5)*4*act);
    const kmh=(act*(16+6*vnoise(t*3))).toFixed(1);
    const tx=V?m+30:W-m-30, al=V?'left':'right', by=V?BOT-m-300:BOT-m-40;
    txt(`♥ ${bpm} BPM`, tx, by, `700 ${V?34:30}px 'JetBrains Mono'`, bpm>140?C.red:C.text, al, ha);
    txt(`VIT ${kmh.padStart(4,' ')} KM/H`, tx, by-(V?52:44), `400 ${V?30:26}px 'JetBrains Mono'`, C.dim, al, ha);
    // heartbeat line
    ctx.save(); ctx.globalAlpha=ha*.9; ctx.strokeStyle=bpm>140?C.red:C.text; ctx.lineWidth=3; ctx.beginPath();
    const w0=V?300:320, x0=V?m+30:W-m-30-w0, y0=by+(V?60:-100); const per=60/bpm;
    for(let i=0;i<=120;i++){ const u=i/120, tt=t-(1-u)*1.6, ph=(((tt%per)+per)%per)/per; const yv=ph<.08?-Math.sin(ph/.08*Math.PI)*30:(ph<.14?Math.sin((ph-.08)/.06*Math.PI)*12:0);
      const X=x0+u*w0, Y=y0+yv; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); } ctx.stroke(); ctx.restore();
  }

  // post
  if(shake>0){ const img=ctx.getImageData(0,0,W,H), dx=Math.round((hash(t*91)-.5)*shake), dy=Math.round((hash(t*37)-.5)*shake); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.putImageData(img,dx,dy); }
  if(flash>0){ ctx.fillStyle=`rgba(255,248,236,${flash})`; ctx.fillRect(0,0,W,H); }
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.62); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.6)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.16; ctx.drawImage(GRAIN[Math.floor(t*FPS)%8],0,0,W,H); ctx.restore();
  if(!V){ ctx.fillStyle='#000'; ctx.fillRect(0,0,W,TOP); ctx.fillRect(0,BOT,W,H-BOT); }
  ctx.restore();
}
window.render=render;
window.ready=Promise.all(Object.values(IMG).map(i=>i.decode())).then(()=>document.fonts.ready).then(()=>Promise.all([document.fonts.load("200px Anton"),document.fonts.load("700 30px 'JetBrains Mono'"),document.fonts.load("400 30px 'JetBrains Mono'")])).then(()=>true);
</script>
</body></html>
