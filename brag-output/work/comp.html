<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/g.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30, DUR = 22;
const BAR = 138;                       // letterbox bars
const C = { bg:'#050506', text:'#ECE8E0', red:'#FF2B2B', dim:'#8A8680' };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ── helpers ──
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const ss = (a,b,x)=>{ const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
const eo = t=>1-Math.pow(1-clamp(t),3);
const eio = t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
const hash = (n)=>{ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };
function vnoise(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return lerp(hash(i),hash(i+1),u); }

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

// film grain tiles (pre-generated, picked per frame)
const GRAIN = [];
{ const r=rng(7); for(let k=0;k<8;k++){ const g=mk(480,270), gc=g.getContext('2d'), im=gc.createImageData(480,270);
  for(let i=0;i<im.data.length;i+=4){ const v=r()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  gc.putImageData(im,0,0); GRAIN.push(g); } }

// dust motes, fixed field
const DUST = (()=>{ const r=rng(11), a=[]; for(let i=0;i<260;i++) a.push({x:r()*W,y:r()*H,z:.3+r()*1.2,s:r()*6.28,v:.2+r()*.8}); return a; })();

function darkness(lx,ly,rad,strength=1,warm=true){
  // flashlight: black everywhere except a soft pool around (lx,ly)
  const g = ctx.createRadialGradient(lx,ly,0,lx,ly,rad);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(.45,`rgba(0,0,0,${.35*strength})`);
  g.addColorStop(1,`rgba(0,0,0,${.97*strength})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if (warm){ const g2=ctx.createRadialGradient(lx,ly,0,lx,ly,rad*.5);
    g2.addColorStop(0,'rgba(255,240,215,.10)'); g2.addColorStop(1,'rgba(255,240,215,0)');
    ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g2; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over'; }
}

function drawDust(t, lx, ly, rad, alpha=1){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const d of DUST){
    const x = (d.x + t*18*d.v + Math.sin(t*.7+d.s)*20) % W;
    const y = (d.y - t*9*d.v + Math.cos(t*.5+d.s)*14 + H) % H;
    const dist = Math.hypot(x-lx,y-ly), k = clamp(1-dist/rad);
    if (k<=0) continue;
    ctx.fillStyle=`rgba(255,244,225,${.55*k*k*alpha})`;
    ctx.beginPath(); ctx.arc(x,y,d.z*1.6,0,6.283); ctx.fill();
  }
  ctx.restore();
}

function text(str, x, y, font, color, align='center', alpha=1, spacing=0){
  ctx.save(); ctx.font=font; ctx.fillStyle=color; ctx.globalAlpha=alpha; ctx.textAlign=align; ctx.textBaseline='middle';
  if (spacing) ctx.letterSpacing = spacing+'px';
  ctx.fillText(str,x,y); ctx.restore();
}

// typed text: reveals characters between t0 and t1
function typed(str,t,t0,t1){ const n=Math.floor(str.length*clamp((t-t0)/(t1-t0))); return str.slice(0,n); }

// glitch-render a string via offscreen slices + RGB split
function glitchText(str, x, y, font, amt, seed, color=C.text, spacing=0){
  const o=mk(W,420), oc=o.getContext('2d');
  oc.font=font; oc.textAlign='center'; oc.textBaseline='middle'; oc.fillStyle=color;
  if (spacing) oc.letterSpacing=spacing+'px';
  oc.fillText(str,W/2,210);
  const r=rng(seed);
  if (amt>0.001){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.55*amt;
    ctx.filter='none';
    // red / cyan ghosts
    const tint=(col)=>{ const t2=mk(W,420), tc=t2.getContext('2d'); tc.drawImage(o,0,0); tc.globalCompositeOperation='source-in'; tc.fillStyle=col; tc.fillRect(0,0,W,420); return t2; };
    ctx.drawImage(tint('#ff2020'), x-W/2-26*amt, y-210);
    ctx.drawImage(tint('#20e0ff'), x-W/2+26*amt, y-210);
    ctx.restore();
  }
  // slices
  if (amt<=0.001){ ctx.drawImage(o,x-W/2,y-210); return; }
  let yy=0;
  while(yy<420){ const h=8+Math.floor(r()*40); const off = (r()<.35? (r()-.5)*160*amt : 0);
    ctx.drawImage(o,0,yy,W,h,x-W/2+off,y-210+yy,W,h); yy+=h; }
}

// ── scene pieces ──
function corridor(t){
  // one-point perspective corridor
  const vx = W/2 + Math.sin(t*.4)*30, vy = H*.46;
  ctx.fillStyle='#0b0b0d'; ctx.fillRect(0,0,W,H);
  const back = {x0:vx-170,x1:vx+170,y0:vy-150,y1:vy+130};
  // walls
  const wall=(pts,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(...pts[0]); for(const p of pts.slice(1)) ctx.lineTo(...p); ctx.fill(); };
  wall([[0,0],[back.x0,back.y0],[back.x0,back.y1],[0,H]], '#2a2825');
  wall([[W,0],[back.x1,back.y0],[back.x1,back.y1],[W,H]], '#262421');
  wall([[0,0],[W,0],[back.x1,back.y0],[back.x0,back.y0]], '#1c1b19');
  wall([[0,H],[W,H],[back.x1,back.y1],[back.x0,back.y1]], '#302d29');
  // back door (dark hole) + frame
  ctx.fillStyle='#050505'; ctx.fillRect(vx-60,vy-95,120,225);
  // door frames on side walls
  for(let i=0;i<4;i++){
    const k = Math.pow(.62,i), xL = lerp(back.x0,0,k), xR = lerp(back.x1,W,k);
    const yT = lerp(back.y0,0,k), yB = lerp(back.y1,H,k);
    const dh = (yB-yT)*.62, dwL = (vx-xL)*.16;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(xL+dwL*.4, yB-dh-(yB-yT)*.02, dwL*.8, dh*.98);
    ctx.fillRect(xR-dwL*1.2, yB-dh-(yB-yT)*.02, dwL*.8, dh*.98);
  }
  // peeling paint streaks / cracks
  const r=rng(3); ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=2;
  for(let i=0;i<40;i++){ const x=r()*W, y=r()*H; if (Math.abs(x-vx)<200 && Math.abs(y-vy)<160) continue;
    ctx.beginPath(); ctx.moveTo(x,y); let px=x,py=y; for(let j=0;j<6;j++){ px+=(r()-.5)*40; py+=r()*30; ctx.lineTo(px,py);} ctx.stroke(); }
  // debris on floor
  for(let i=0;i<70;i++){ const u=r(), d=.15+r()*.85; const x=lerp(vx,(u*2-.5)*W,d), y=lerp(vy+130,H,d);
    ctx.fillStyle=`rgba(${60+r()*40|0},${55+r()*35|0},${50+r()*30|0},.9)`; ctx.fillRect(x,y,6+d*28*r(),3+d*10*r()); }
}

function moonWindow(t, zoom){
  ctx.fillStyle='#07070a'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,H*.55); ctx.scale(zoom,zoom);
  // arched window
  const ww=620, wh=760, top=-wh*.62;
  const g=ctx.createRadialGradient(0,top+120,30,0,top+200,700);
  g.addColorStop(0,'#dfe6f0'); g.addColorStop(.35,'#7f8ea3'); g.addColorStop(1,'#1b2230');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(-ww/2,wh*.38); ctx.lineTo(-ww/2,top+ww/2); ctx.arc(0,top+ww/2,ww/2,Math.PI,0); ctx.lineTo(ww/2,wh*.38); ctx.closePath(); ctx.fill();
  // mullions + broken panes
  ctx.strokeStyle='#050507'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.moveTo(0,top); ctx.lineTo(0,wh*.38);
  for(let y=top+ww/2-60; y<wh*.38; y+=150){ ctx.moveTo(-ww/2,y); ctx.lineTo(ww/2,y); }
  ctx.stroke();
  const r=rng(21); ctx.fillStyle='rgba(8,8,12,.85)';
  for(let i=0;i<5;i++){ const x=(r()-.5)*ww*.8, y=top+ww/2+r()*500; ctx.beginPath(); ctx.moveTo(x,y);
    for(let j=0;j<5;j++) ctx.lineTo(x+(r()-.5)*120, y+(r()-.5)*110); ctx.fill(); }
  // light shafts
  ctx.globalCompositeOperation='lighter';
  const sh=ctx.createLinearGradient(0,top,0,H); sh.addColorStop(0,'rgba(170,190,220,.10)'); sh.addColorStop(1,'rgba(170,190,220,0)');
  ctx.fillStyle=sh; ctx.beginPath(); ctx.moveTo(-ww/2,top+ww/2); ctx.lineTo(ww/2,top+ww/2); ctx.lineTo(ww*1.3,H); ctx.lineTo(-ww*1.3,H); ctx.fill();
  ctx.restore();
}

function figurePath(){
  const p=new Path2D();
  p.moveTo(-330,0); p.lineTo(-325,-200);
  p.bezierCurveTo(-330,-390,-300,-455,-235,-495);
  p.bezierCurveTo(-180,-528,-128,-540,-102,-572);
  p.bezierCurveTo(-148,-655,-138,-812,-42,-890);
  p.bezierCurveTo(-14,-912,14,-912,42,-890);
  p.bezierCurveTo(138,-812,148,-655,102,-572);
  p.bezierCurveTo(128,-540,180,-528,235,-495);
  p.bezierCurveTo(300,-455,330,-390,325,-200);
  p.lineTo(330,0); p.closePath();
  return p;
}
const FIG = figurePath();

function figure(t, x, y, s, eyeGlow){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  // backlight halo
  ctx.save(); ctx.shadowColor='rgba(210,225,245,.95)'; ctx.shadowBlur=60; ctx.strokeStyle='rgba(230,238,250,.85)'; ctx.lineWidth=7; ctx.stroke(FIG); ctx.restore();
  ctx.fillStyle='#030304'; ctx.fill(FIG);
  // inner rim (thin bright edge along top of hood/shoulders)
  ctx.save(); ctx.clip(FIG); ctx.strokeStyle='rgba(200,215,235,.35)'; ctx.lineWidth=5; ctx.translate(0,6); ctx.stroke(FIG); ctx.restore();
  // hood opening (slightly different black) + balaclava
  ctx.fillStyle='#0a0a0c';
  ctx.beginPath(); ctx.ellipse(0,-700,78,112,0,0,6.283); ctx.fill();
  // goggles band
  ctx.fillStyle='#000'; ctx.fillRect(-82,-735,164,44);
  // tactical vest: straps + pouches, catching faint rim light
  ctx.save(); ctx.clip(FIG);
  ctx.strokeStyle='rgba(160,170,185,.12)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-215,-490); ctx.lineTo(-130,-150); ctx.moveTo(215,-490); ctx.lineTo(130,-150); ctx.stroke();
  for(const [px,py] of [[-170,-300],[-60,-300],[50,-300],[160,-300]]){ ctx.fillStyle='#060607'; ctx.fillRect(px-45+10,py,90-20,120); ctx.strokeRect(px-45+10,py,90-20,120); }
  ctx.restore();
  // lens glints
  if (eyeGlow>0){ ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const ex of [-38,38]){ const g=ctx.createRadialGradient(ex,-713,0,ex,-713,40); g.addColorStop(0,`rgba(255,60,50,${.95*eyeGlow})`); g.addColorStop(.25,`rgba(255,40,40,${.35*eyeGlow})`); g.addColorStop(1,'rgba(255,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,-713,40,0,6.283); ctx.fill(); }
    ctx.restore(); }
  ctx.restore();
}

// building silhouettes for each category (drawn relative to ground line gy)
function building(kind, cx, gy, s){
  ctx.save(); ctx.translate(cx,gy); ctx.scale(s,s);
  const body='#2a2a31', r=rng(kind.length*97);
  const win=(x,y,w,h)=>{ const k=r(); ctx.fillStyle = k<.25? '#030303' : k<.3 ? 'rgba(255,60,50,.0)' : '#08080a'; ctx.fillRect(x,y,w,h); };
  ctx.fillStyle=body;
  if (kind==='chateau'){
    ctx.fillRect(-420,-300,840,300);
    for(const tx of [-470,470]){ ctx.fillRect(tx-80,-470,160,470); ctx.beginPath(); ctx.moveTo(tx-100,-470); ctx.lineTo(tx,-650); ctx.lineTo(tx+100,-470); ctx.fill(); }
    ctx.fillRect(-90,-520,180,520); ctx.beginPath(); ctx.moveTo(-110,-520); ctx.lineTo(0,-760); ctx.lineTo(110,-520); ctx.fill();
    for(let x=-400;x<400;x+=46) ctx.fillRect(x,-330,26,30);
    for(let x=-360;x<=340;x+=100) for(let y=-250;y<-40;y+=110) win(x,y,44,70);
  } else if (kind==='sana'){
    ctx.fillRect(-760,-360,1520,360); ctx.fillRect(-160,-470,320,470);
    ctx.beginPath(); ctx.moveTo(-190,-470); ctx.lineTo(0,-560); ctx.lineTo(190,-470); ctx.fill();
    for(let x=-730;x<=700;x+=62) for(let y=-320;y<-20;y+=100) win(x,y,34,62);
    // balconies
    ctx.fillStyle='#0c0c0f'; for(let y=-240;y<0;y+=100) ctx.fillRect(-760,y,1520,8);
  } else if (kind==='fort'){
    ctx.beginPath(); ctx.moveTo(-700,0); ctx.lineTo(-560,-230); ctx.lineTo(560,-230); ctx.lineTo(700,0); ctx.fill();
    ctx.fillRect(-620,-120,1240,120);
    ctx.fillStyle='#050506'; for(let x=-450;x<=450;x+=150) ctx.fillRect(x-40,-150,80,34);
    ctx.fillStyle='#0a0a0c'; ctx.beginPath(); ctx.arc(0,0,110,Math.PI,0); ctx.fill();
  } else { // usine
    ctx.fillRect(-720,-260,1440,260);
    for(let i=0;i<6;i++){ const x=-720+i*240; ctx.beginPath(); ctx.moveTo(x,-260); ctx.lineTo(x+240,-380); ctx.lineTo(x+240,-260); ctx.fill(); }
    for(const [x,h] of [[-520,720],[-380,600],[560,660]]) ctx.fillRect(x-30,-h,60,h);
    for(let x=-690;x<=660;x+=90) win(x,-200,50,110);
  }
  ctx.restore();
}

function sky(t, moonX){
  const g=ctx.createLinearGradient(0,BAR,0,H-BAR); g.addColorStop(0,'#10141d'); g.addColorStop(1,'#2a3244');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const m=ctx.createRadialGradient(moonX,300,0,moonX,300,380); m.addColorStop(0,'rgba(220,228,240,.5)'); m.addColorStop(.08,'rgba(220,228,240,.22)'); m.addColorStop(1,'rgba(220,228,240,0)');
  ctx.fillStyle=m; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(235,240,250,.9)'; ctx.beginPath(); ctx.arc(moonX,300,26,0,6.283); ctx.fill();
  // ground
  ctx.fillStyle='#060607'; ctx.fillRect(0,H-BAR-120,W,200);
}

function hudBrackets(x,y,w,h,col,len=34){
  ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath();
  for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ const cx=x+sx*w/2, cy=y+sy*h/2; ctx.moveTo(cx,cy-sy*len); ctx.lineTo(cx,cy); ctx.lineTo(cx-sx*len,cy); }
  ctx.stroke();
}

// ── text-to-dust (scene 5) ──
let DUSTTXT=null;
function prepDustText(){
  const o=mk(W,200), oc=o.getContext('2d');
  oc.font="500 84px Inter"; oc.textAlign='center'; oc.textBaseline='middle'; oc.fillStyle='#fff';
  oc.fillText('Ne laisse aucune trace.',W/2,100);
  const im=oc.getImageData(0,0,W,200).data, pts=[]; const r=rng(5);
  let minx=W,maxx=0;
  for(let y=0;y<200;y+=3) for(let x=0;x<W;x+=3){ if (im[(y*W+x)*4+3]>128){ pts.push({x,y,vx:40+r()*160,vy:-(30+r()*140),d:r()}); minx=Math.min(minx,x); maxx=Math.max(maxx,x);} }
  DUSTTXT={canvas:o,pts,minx,maxx};
}

// ── topo map (scene 6) ──
function topo(t,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle='rgba(236,232,224,.10)'; ctx.lineWidth=1.5;
  const centers=[[520,420,1],[1380,640,2],[980,300,3],[300,820,4],[1650,280,5]];
  for(const [cx,cy,sd] of centers){
    for(let k=1;k<9;k++){ ctx.beginPath();
      for(let i=0;i<=120;i++){ const a=i/120*6.283; const rr=k*38+14*Math.sin(3*a+sd)+10*Math.sin(5*a+sd*2+t*.2)+8*Math.sin(2*a+k*.5);
        const x=cx+Math.cos(a)*rr*1.3, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.stroke(); } }
  ctx.restore();
}

// ── main render ──
function render(t){
  ctx.save(); ctx.clearRect(0,0,W,H); ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  let flash=0, shake=0;

  if (t<3.2){                                        // 1 — HOOK
    const p=t/3.2;
    const lx = lerp(-100, W*.62, eio(ss(0,2.6,t))) + Math.sin(t*9)*6, ly = H*.52 + Math.sin(t*2.3)*30;
    corridor(t);
    darkness(lx,ly,lerp(360,520,ss(0,3,t)));
    drawDust(t,lx,ly,520);
    const a = ss(.7,1.1,t)*(1-ss(3.0,3.2,t));
    text('Ils ne t’ont pas vu entrer.', W/2, H-BAR-110, "500 60px Inter", C.text, 'center', a);
    ctx.fillStyle=`rgba(0,0,0,${1-ss(0,.35,t)})`; ctx.fillRect(0,0,W,H);
  }
  else if (t<7.4){                                   // 2 — REVEAL
    const lt=t-3.2;
    moonWindow(t, lerp(1.0,1.08,lt/4.2));
    figure(t, W/2, H+40, lerp(.96,1.02,lt/4.2)*(H/1150), ss(.3,.9,lt)*(0.8+0.2*Math.sin(t*6)));
    drawDust(t,W/2,H*.35,900,.7);
    // title
    if (lt>0.9){
      const g = 1-ss(1.0,1.55,lt);
      const f = Math.floor(t*FPS);
      const blink = (lt<1.05 && f%2)?0:1;
      ctx.save(); ctx.globalAlpha=blink;
      ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=40;
      const TY=H*.64;
      glitchText('NOTRACE', W/2, TY, "250px Anton", Math.max(g, (f%23===0)?.4:0), f, C.text, 20);
      ctx.restore();
      // the red slash that turns the O into an Ø
      ctx.save(); ctx.font="250px Anton"; ctx.letterSpacing='20px';
      const full=ctx.measureText('NOTRACE').width, wN=ctx.measureText('N').width, wO=ctx.measureText('O').width-20;
      const ox=W/2-full/2+wN+wO/2-5, sl=eo(ss(1.35,1.6,lt));
      ctx.strokeStyle=C.red; ctx.lineWidth=16; ctx.lineCap='square'; ctx.shadowColor='rgba(255,43,43,.8)'; ctx.shadowBlur=24;
      if (sl>0){ ctx.beginPath(); ctx.moveTo(ox-wO*.55, TY+80); ctx.lineTo(lerp(ox-wO*.55, ox+wO*.55, sl), lerp(TY+80, TY-140, sl)); ctx.stroke(); }
      ctx.restore();
    }
    const sa = ss(2.0,2.4,lt)*(1-ss(4.0,4.2,lt));
    text('URBEXEUR  ·  FULL BLACK', W/2, H*.64+170, "700 34px 'JetBrains Mono'", C.red, 'center', sa, 10);
    flash = 1-ss(0,.25,lt);
    shake = (1-ss(0,.5,lt))*14;
  }
  else if (t<10.8){                                  // 3 — HUD
    const lt=t-7.4;
    sky(t, 1500);
    building('sana', W/2+lerp(40,-40,lt/3.4), H-BAR-60, 1.0);
    // night-vision tint
    ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.fillStyle='rgba(150,165,160,1)'; ctx.fillRect(0,0,W,H); ctx.restore();
    // scanlines
    ctx.fillStyle='rgba(0,0,0,.25)'; for(let y=0;y<H;y+=4) ctx.fillRect(0,y,W,2);
    // crosshair locks onto a window
    const tx = W/2+lerp(40,-40,lt/3.4)+186+17, ty = H-BAR-60-220+31;
    const k = eio(ss(.1,1.3,lt));
    const cx = lerp(W*.25,tx,k), cy=lerp(H*.3,ty,k), sz=lerp(420,120,k);
    const locked = lt>1.3;
    hudBrackets(cx,cy,sz,sz, locked?C.red:C.text);
    ctx.strokeStyle=locked?C.red:'rgba(236,232,224,.5)'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(cx-sz,cy); ctx.lineTo(cx-sz*.6,cy); ctx.moveTo(cx+sz*.6,cy); ctx.lineTo(cx+sz,cy);
    ctx.moveTo(cx,cy-sz); ctx.lineTo(cx,cy-sz*.6); ctx.moveTo(cx,cy+sz*.6); ctx.lineTo(cx,cy+sz); ctx.stroke();
    if (locked && Math.floor(lt*6)%2===0){ ctx.fillStyle=C.red; ctx.beginPath(); ctx.arc(cx,cy,5,0,6.283); ctx.fill(); }
    // readouts
    const L = [
      ['CIBLE', 'SANATORIUM ABANDONNÉ', .25, .7],
      ['STATUT', 'INDÉTECTABLE', .75, 1.1],
      ['SIGNATURE THERMIQUE', 'AUCUNE', 1.25, 1.6],
    ];
    L.forEach(([k2,v,a0,a1],i)=>{
      const y=BAR+90+i*66, s=typed(k2+' : '+v, lt, a0, a1);
      ctx.save(); ctx.font="700 40px 'JetBrains Mono'"; ctx.textBaseline='middle'; ctx.fillStyle=C.text; ctx.globalAlpha=lt>a0?1:0;
      const kp=s.slice(0,Math.min(s.length,k2.length+3)); ctx.fillText(kp,120,y);
      ctx.fillStyle = i>0? C.red : C.text; ctx.fillText(s.slice(kp.length), 120+ctx.measureText(kp).width, y); ctx.restore();
    });
    // rec + ticking coordinates (texture)
    const f=Math.floor(t*FPS);
    text('● REC', W-120, BAR+60, "700 26px 'JetBrains Mono'", C.red, 'right', Math.floor(t*2)%2?1:.25);
    text(`${(46.2+vnoise(t*3)*.01).toFixed(5)} N   ${(2.21+vnoise(t*3+9)*.01).toFixed(5)} E`, W-120, H-BAR-50, "400 24px 'JetBrains Mono'", 'rgba(236,232,224,.6)', 'right');
    text(`NV-02  ·  ${String(f).padStart(4,'0')}`, 120, H-BAR-50, "400 24px 'JetBrains Mono'", 'rgba(236,232,224,.6)', 'left');
    flash = (1-ss(0,.12,lt))*.5;
  }
  else if (t<15.0){                                  // 4 — CATEGORIES
    const lt=t-10.8, i=Math.min(3,Math.floor(lt/1.05)), st=lt-i*1.05;
    const kinds=['chateau','sana','fort','usine'];
    const names=['CHÂTEAUX','SANATORIUMS','FORTS MILITAIRES','SITES INDUSTRIELS'];
    sky(t, [420,1500,1300,600][i]);
    const drift = lerp(-30,30,st/1.05);
    building(kinds[i], W/2+drift, H-BAR-100, [1.0,.95,1.15,1.0][i]);
    // flashlight sweep across facade
    const lx = lerp(W*.2, W*.8, st/1.05) + (i%2? -1:1)*0, ly = H*.52;
    ctx.save(); ctx.globalCompositeOperation='multiply';
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,700); g.addColorStop(0,'#fff'); g.addColorStop(.5,'#8a8a8a'); g.addColorStop(1,'#3a3a3a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
    drawDust(t,lx,ly,600,.6);
    // label
    ctx.save();
    const s = lerp(1.08,1,eo(st/.35));
    ctx.translate(W/2, H*.40); ctx.scale(s,s);
    ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=30;
    text(names[i], 0, 0, "200px Anton", C.text, 'center', 1, 8);
    ctx.restore();
    text('SUR LA CARTE', W/2, BAR+70, "700 28px 'JetBrains Mono'", C.red, 'center', 1, 12);
    text(`0${i+1} / 04`, W-120, BAR+70, "400 26px 'JetBrains Mono'", 'rgba(236,232,224,.6)', 'right');
    flash = (1-ss(0,.14,st))*.55; shake=(1-ss(0,.25,st))*8;
  }
  else if (t<18.4){                                  // 5 — THE CODE
    const lt=t-15.0;
    ctx.fillStyle='#030304'; ctx.fillRect(0,0,W,H);
    drawDust(t,W/2,H/2,1100,.35);
    const a1 = ss(.2,.6,lt)*(1-ss(3.0,3.4,lt));
    text('Ne prends que des photos.', W/2, H/2-70, "300 70px Inter", 'rgba(236,232,224,.75)', 'center', a1);
    if (!DUSTTXT) prepDustText();
    const a2 = ss(1.3,1.7,lt);
    const d = ss(2.8,3.4,lt);                         // dissolve progress
    const span = DUSTTXT.maxx-DUSTTXT.minx, sx = DUSTTXT.minx + d*(span+120) - 60;
    ctx.save(); ctx.globalAlpha=a2;
    ctx.beginPath(); ctx.rect(sx,0,W,H); ctx.clip();
    ctx.drawImage(DUSTTXT.canvas,0,H/2+40-100);
    ctx.restore();
    if (d>0){
      ctx.fillStyle=C.text;
      for(const p of DUSTTXT.pts){
        if (p.x>sx) continue;
        const age = (sx-p.x)/(span+120)*0.6 + p.d*.05;
        const al = clamp(1-age*2.2)*a2; if (al<=0) continue;
        ctx.globalAlpha=al;
        ctx.fillRect(p.x+p.vx*age+Math.sin(p.d*40+t*3)*6*age, H/2+40-100+p.y+p.vy*age, 2.4, 2.4);
      }
      ctx.globalAlpha=1;
    }
  }
  else {                                             // 6 — OUTRO
    const lt=t-18.4;
    ctx.fillStyle='#050506'; ctx.fillRect(0,0,W,H);
    topo(t, ss(0,.8,lt));
    // pins lighting up
    const r=rng(42);
    for(let i=0;i<34;i++){
      const x=180+r()*(W-360), y=BAR+60+r()*(H-2*BAR-120), t0=.1+r()*1.6;
      if (Math.abs(x-W/2)<520 && Math.abs(y-H/2)<170) continue;
      const k=ss(t0,t0+.2,lt); if (k<=0) continue;
      ctx.globalAlpha=k; ctx.fillStyle=C.red; ctx.beginPath(); ctx.arc(x,y,5,0,6.283); ctx.fill();
      const pr=((lt-t0)%1.6)/1.6; ctx.strokeStyle=`rgba(255,43,43,${.6*(1-pr)})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,6+pr*34,0,6.283); ctx.stroke();
      ctx.globalAlpha=1;
    }
    text('La carte des lieux abandonnés.', W/2, H/2-120, "300 46px Inter", C.text, 'center', ss(.3,.7,lt));
    const ua = ss(.8,1.1,lt);
    ctx.save(); ctx.globalAlpha=ua; ctx.shadowColor='rgba(0,0,0,1)'; ctx.shadowBlur=30;
    const f=Math.floor(t*FPS);
    glitchText('URBEX-FRANCE.COM', W/2, H/2+20, "170px Anton", (1-ss(.8,1.3,lt)), 900+f, C.text, 6);
    ctx.restore();
    text('présenté par  NØTRACE', W/2, H/2+160, "700 30px 'JetBrains Mono'", C.red, 'center', ss(1.5,1.9,lt), 8);
    // lights out
    ctx.fillStyle=`rgba(0,0,0,${ss(3.25,3.6,lt)})`; ctx.fillRect(0,0,W,H);
  }

  // ── post: shake, flash, vignette, grain, letterbox ──
  if (shake>0){ const img=ctx.getImageData(0,0,W,H); const dx=Math.round((hash(t*91)-.5)*shake), dy=Math.round((hash(t*37)-.5)*shake);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.putImageData(img,dx,dy); }
  if (flash>0){ ctx.fillStyle=`rgba(255,250,240,${flash*.85})`; ctx.fillRect(0,0,W,H); }
  const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.75)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.16; ctx.drawImage(GRAIN[Math.floor(t*FPS)%8],0,0,W,H); ctx.restore();
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,BAR); ctx.fillRect(0,H-BAR,W,BAR);
  ctx.restore();
}
window.render = render;
window.ready = document.fonts.ready.then(()=>Promise.all([
  document.fonts.load("300px Anton"), document.fonts.load("700 30px 'JetBrains Mono'"), document.fonts.load("300 40px Inter"), document.fonts.load("500 40px Inter")
])).then(()=>{ prepDustText(); return true; });
</script>
</body></html>
