<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/g.css">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080, H=1920, FPS=30, DUR=17;
const C={ promo:'#FF6F61', ink:'#3E4650', soft:'#7C8792', white:'#FFFFFF', accent:'#8EC5D6', warm:'#F4D9C6' };
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{ const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
const eio=t=>{ t=clamp(t); return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; };
const eob=t=>{ t=clamp(t); const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
const hash=n=>{ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); };

const IMG=new Image(); IMG.src='bain.jpg';

// camera keyframes on the photo (normalised centre + zoom); eased between keys
const KEYS=[
  {t:0.0,  x:.66, y:.47, z:2.35},   // smiling cloud
  {t:3.0,  x:.65, y:.47, z:2.55},
  {t:3.6,  x:.42, y:.42, z:2.2},    // grumpy cloud
  {t:5.6,  x:.31, y:.55, z:2.05},   // the Twistshake cup
  {t:6.4,  x:.32, y:.55, z:2.1},
  {t:9.0,  x:.5,  y:.52, z:1.0},    // pull out: the whole bath
  {t:10.2, x:.52, y:.56, z:1.02},
  {t:12.2, x:.6,  y:.7,  z:1.22},   // drift down to the logo on the rim
];
function cam(t){
  if(t<=KEYS[0].t) return KEYS[0];
  for(let i=0;i<KEYS.length-1;i++){ const a=KEYS[i], b=KEYS[i+1]; if(t<=b.t){ const e=eio((t-a.t)/(b.t-a.t)); return {x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e),z:lerp(a.z,b.z,e)}; } }
  return KEYS[KEYS.length-1];
}
function photo(t){
  const iw=IMG.width, ih=IMG.height, c=cam(t), base=Math.max(W/iw,H/ih), S=base*c.z, vw=W/S, vh=H/S;
  const cx=clamp(c.x*iw,vw/2,iw-vw/2), cy=clamp(c.y*ih,vh/2,ih-vh/2);
  ctx.save(); ctx.translate(W/2,H/2); ctx.scale(S,S); ctx.imageSmoothingQuality='high'; ctx.drawImage(IMG,-cx,-cy); ctx.restore();
  // soft pastel grade: cool top, warm bottom (the photo is monochrome)
  ctx.save(); ctx.globalCompositeOperation='soft-light';
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(142,197,214,.55)'); g.addColorStop(1,'rgba(244,217,198,.55)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation='screen'; ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(0,0,W,H); ctx.restore();
}

// soap bubbles: rise, wobble, iridescent rim + highlight
const BUB=(()=>{ const r=rng(5),a=[]; for(let i=0;i<26;i++) a.push({x:r()*W, t0:r()*14, r:18+r()*54, sp:60+r()*90, ph:r()*6.28, hue:r()*360}); return a; })();
function bubbles(t,alpha){
  for(const b of BUB){
    const age=t-b.t0; if(age<0) continue;
    const y=H+80-age*b.sp; if(y<-120) continue;
    const x=b.x+Math.sin(age*1.3+b.ph)*30, r=b.r*(1+.04*Math.sin(age*5+b.ph));
    const a=alpha*ss(0,.4,age);
    ctx.save(); ctx.globalAlpha=a;
    const g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,.05)'); g.addColorStop(.8,'rgba(255,255,255,.08)'); g.addColorStop(.95,`hsla(${b.hue+age*40},80%,80%,.55)`); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
    ctx.strokeStyle=`hsla(${b.hue+120+age*40},70%,85%,.5)`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,r*.97,0,6.283); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(x-r*.38,y-r*.42,r*.16,r*.09,-.6,0,6.283); ctx.fill();
    ctx.restore();
  }
}
// twinkles on the water droplets
function twinkles(t,alpha){
  const r=rng(9);
  for(let i=0;i<40;i++){ const x=r()*W, y=r()*H, p=r()*6.28, sp=1.5+r()*2; const k=Math.pow(Math.max(0,Math.sin(t*sp+p)),12)*alpha; if(k<.02) continue;
    const s=6+10*k; ctx.save(); ctx.globalAlpha=k; ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x+s,y); ctx.moveTo(x,y-s); ctx.lineTo(x,y+s); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,2.2,0,6.283); ctx.fill(); ctx.restore(); }
}

// rounded pill caption
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function pill(str,y,t0,t1,t,size=64){
  const a=ss(t0,t0+.35,t)*(1-ss(t1-.3,t1,t)); if(a<=0) return;
  const s=lerp(.85,1,eob((t-t0)/.45));
  ctx.save(); ctx.globalAlpha=a; ctx.translate(W/2,y+(1-a)*20); ctx.scale(s,s);
  ctx.font=`900 ${size}px Nunito`; const w=ctx.measureText(str).width+size*1.1, h=size*1.6;
  ctx.shadowColor='rgba(60,70,80,.18)'; ctx.shadowBlur=30; ctx.shadowOffsetY=8; rrect(-w/2,-h/2,w,h,h/2); ctx.fillStyle='rgba(255,255,255,.93)'; ctx.fill(); ctx.shadowColor='transparent';
  ctx.fillStyle=C.ink; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(str,0,4); ctx.restore();
}
function word(str,y,t0,t,size,color,weight=900,spacing=0){
  const a=ss(t0,t0+.4,t); if(a<=0) return; ctx.save(); ctx.globalAlpha=a; ctx.font=`${weight} ${size}px Nunito`; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(spacing) ctx.letterSpacing=spacing+'px'; ctx.fillStyle=color; ctx.translate(W/2,y+(1-eob((t-t0)/.5))*30); ctx.fillText(str,0,0); ctx.restore(); }

function render(t){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  photo(t);
  twinkles(t, t<12.2?1:0);
  bubbles(t,1);

  pill('L’heure du bain 🛁', 1500, .4, 3.1, t);
  pill('tout en douceur', 1500, 3.4, 6.1, t);
  pill('avec ses petits copains', 1500, 6.4, 9.0, t, 60);
  pill('La baignoire Twistshake', 1500, 9.4, 12.1, t, 60);

  // promo sticker during the video
  const sa=ss(1.0,1.3,t)*(1-ss(12.2,12.6,t));
  if(sa>0){ const pop=eob((t-1.0)/.45); const beat=1+.05*Math.max(0,Math.sin((t-1)*Math.PI*2/1.25))**6;
    ctx.save(); ctx.globalAlpha=sa; ctx.translate(840,330); ctx.rotate(-.12+Math.sin(t*1.6)*.05); ctx.scale(pop*beat,pop*beat);
    ctx.shadowColor='rgba(255,111,97,.45)'; ctx.shadowBlur=40; ctx.fillStyle=C.promo; ctx.beginPath();
    for(let i=0;i<=48;i++){ const a2=i/48*6.283, r=i%2?128:138; ctx.lineTo(Math.cos(a2)*r,Math.sin(a2)*r); } ctx.closePath(); ctx.fill(); ctx.shadowColor='transparent';
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='900 78px Nunito'; ctx.fillText('-60%',0,-10);
    ctx.font='800 26px Nunito'; ctx.fillText('sur le site',0,48); ctx.restore(); }

  // end card: white wipe up from the bottom, then name, offer, code, CTA
  const e=eio(ss(12.2,12.9,t));
  if(e>0){ ctx.save(); ctx.fillStyle='#FAFBFC'; ctx.beginPath(); ctx.rect(0,H*(1-e),W,H*e); ctx.fill(); ctx.restore();
    bubbles(t,e);
    word('La baignoire',520,12.8,t,58,C.soft,600);
    word('TWISTSHAKE',615,12.95,t,112,C.ink,900,6);
    // -60 %
    const pa=ss(13.3,13.6,t); if(pa>0){ ctx.save(); ctx.globalAlpha=pa; const sc=lerp(1.4,1,eob((t-13.3)/.45)); ctx.translate(W/2,840); ctx.scale(sc,sc);
      ctx.fillStyle=C.promo; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='900 190px Nunito'; ctx.fillText('-60%',0,0);
      ctx.font='800 50px Nunito'; ctx.fillStyle=C.ink; ctx.fillText('déjà sur le site',0,122); ctx.restore(); }
    // coupon: +20 % with code CLOOE
    const ca=ss(14.0,14.35,t); if(ca>0){ ctx.save(); ctx.globalAlpha=ca; const sc=lerp(.85,1,eob((t-14.0)/.45)); ctx.translate(W/2,1210); ctx.rotate(-.02); ctx.scale(sc,sc);
      const w=820,h=270; ctx.shadowColor='rgba(60,70,80,.18)'; ctx.shadowBlur=36; ctx.shadowOffsetY=10;
      ctx.beginPath(); ctx.moveTo(-w/2+30,-h/2); ctx.lineTo(w/2-30,-h/2); ctx.arcTo(w/2,-h/2,w/2,-h/2+30,30); ctx.lineTo(w/2,-26); ctx.arc(w/2,0,26,-Math.PI/2,Math.PI/2,true); ctx.lineTo(w/2,h/2-30); ctx.arcTo(w/2,h/2,w/2-30,h/2,30);
      ctx.lineTo(-w/2+30,h/2); ctx.arcTo(-w/2,h/2,-w/2,h/2-30,30); ctx.lineTo(-w/2,26); ctx.arc(-w/2,0,26,Math.PI/2,-Math.PI/2,true); ctx.lineTo(-w/2,-h/2+30); ctx.arcTo(-w/2,-h/2,-w/2+30,-h/2,30); ctx.closePath();
      ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent'; ctx.setLineDash([14,10]); ctx.lineWidth=4; ctx.strokeStyle=C.promo; ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=C.ink; ctx.font='800 48px Nunito'; ctx.fillText('+ -20% en plus avec le code',0,-62);
      const glow=.5+.5*Math.sin(t*5); ctx.shadowColor=`rgba(255,111,97,${.35*glow})`; ctx.shadowBlur=24;
      ctx.fillStyle=C.promo; ctx.font='900 118px Nunito'; ctx.letterSpacing='14px'; ctx.fillText('CLOOE',7,48); ctx.restore(); }
    word('\u2193  lien en description  \u2193',1440,14.7,t,46,C.soft,800);
  }
  // soft fade in / out
  ctx.fillStyle=`rgba(255,255,255,${1-ss(0,.5,t)})`; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`rgba(255,255,255,${ss(16.6,17,t)})`; ctx.fillRect(0,0,W,H);
  ctx.restore();
}
window.render=render;
window.ready=IMG.decode().then(()=>document.fonts.ready).then(()=>Promise.all([document.fonts.load('900 60px Nunito'),document.fonts.load('600 60px Nunito'),document.fonts.load('800 60px Nunito'),document.fonts.load('700 60px Nunito')])).then(()=>true);
</script>
</body></html>
